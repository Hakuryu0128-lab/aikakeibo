rder:1px solid #dfe4ec;background:#f8fafc;border-radius:12px;padding:12px;margin-top:6px;outline:0;color:#182033}.notice{font-size:11px!important;line-height:1.55;color:#92400e!important;background:#fffbeb;padding:10px;border-radius:11px;margin:10px 0!important}.wide{width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;margin-top:8px;background:#eef1f5;display:flex;align-items:center;justify-content:center;gap:7px}.modal{position:fixed;z-index:50;inset:0;background:#18203366;display:flex;align-items:end;justify-content:center}.sheet{width:100%;max-width:560px;max-height:94dvh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center}.seg{display:grid;grid-template-columns:1fr 1fr;background:#eef1f5;padding:4px;border-radius:14px;margin:15px 0}.seg button{padding:10px;border-radius:10px}.seg .on{background:#fff;color:#4f46e5;font-weight:800}.toast{position:fixed;z-index:100;bottom:90px;left:50%;transform:translateX(-50%);background:#182033;color:#fff;padding:10px 15px;border-radius:13px;font-size:12px;white-space:nowrap}.tools{display:flex;gap:7px;margin:14px 0}.tools input{margin:0;flex:1}.tools select{margin:0;width:105px}.pending{background:#fff7ed;border:1px solid #fed7aa;border-radius:18px;padding:13px;margin:8px 0}.pending h3{font-size:13px;margin:0 0 8px}.pending-row{display:flex;justify-content:space-between;font-size:13px;margin:5px 0}.pending-actions{display:flex;gap:7px;margin-top:10px}.pending-actions button{flex:1;padding:9px;border-radius:11px;background:#fff;border:1px solid #e5e9f0;font-weight:800}.memory{padding:11px;border:1px solid #e5e9f0;border-radius:13px;margin:8px 0;font-size:12px}.memory button{float:right;color:#be123c}.hidden{display:none!important}@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:28px}}
</style></head><body><div id="app"></div>
<script>
const DB='aikakeibo-static-v2'; let state={tab:'ledger',month:new Date(),txs:[],messages:[],memories:[],pending:[],filter:'all',query:'',settings:{apiKey:'',model:'gemini-3.5-flash-lite',temperature:.2,autoRegister:true,highAmount:10000},image:null};
const $=s=>document.querySelector(s), uid=p=>p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,8), today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}, yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{let x=JSON.parse(localStorage.getItem(DB));if(x)state={...state,...x,image:null,month:new Date(x.month||Date.now())}}catch(e){}}function persist(){localStorage.setItem(DB,JSON.stringify({...state,image:null,month:state.month.toISOString()}))}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2100)}
function render(){persist();let app=$('#app');app.className='app';app.innerHTML=(state.tab==='ledger'?ledger():state.tab==='chat'?chat():settings())+`<nav><button data-tab="ledger" class="${state.tab==='ledger'?'on':''}"><span>▤</span>帳簿</button><button data-tab="chat" class="${state.tab==='chat'?'on':''}"><span>✦</span>AI入力</button><button data-tab="settings" class="${state.tab==='settings'?'on':''}"><span>⚙</span>設定</button></nav>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});bind()}
function ledger(){let m=state.month.getFullYear()+'-'+String(state.month.getMonth()+1).padStart(2,'0'),q=(state.query||'').toLowerCase(), rows=state.txs.filter(x=>x.date.startsWith(m)).filter(x=>state.filter==='all'||x.type===state.filter).filter(x=>!q||[x.merchant,x.category,x.paymentMethod,x.note].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt),all=state.txs.filter(x=>x.date.startsWith(m)),inc=all.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),exp=all.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);return `<main><header><div><small style="color:#4f46e5;font-weight:800">MY LEDGER</small><h1>家計簿</h1></div><button class="icon primary" id="add">＋</button></header><section class="summary"><div class="month"><button id="prev">‹</button><b>${state.month.getFullYear()}年${state.month.getMonth()+1}月</b><button id="next">›</button></div><small>今月の収支</small><strong>${inc-exp>=0?'+':''}${yen(inc-exp)}</strong><div class="cols"><div>収入<b>${yen(inc)}</b></div><div>支出<b>${yen(exp)}</b></div></div></section><div class="tools"><input id="query" placeholder="店舗・カテゴリ・メモを検索" value="${esc(state.query)}"><select id="filter"><option value="all">すべて</option><option value="expense" ${state.filter==='expense'?'selected':''}>支出</option><option value="income" ${state.filter==='income'?'selected':''}>収入</option></select></div><h2 class="title">出納帳</h2><section class="list">${rows.length?rows.map(x=>`<div class="row" data-edit="${x.id}"><div class="mark ${x.type}">${x.type==='income'?'↙':'↗'}</div><div class="info"><b>${esc(x.merchant)}</b><small>${x.date} ・ ${esc(x.category)} ・ ${esc(x.paymentMethod)}</small></div><div class="sum ${x.type}">${x.type==='income'?'+':'-'}${yen(x.amount)}</div></div>`).join(''):'<div class="empty">該当する明細はありません</div>'}</section></main>`}
function chat(){return `<main class="chat"><header><div><small style="color:#4f46e5;font-weight:800">GEMINI</small><h1>AI入力</h1></div><small>${esc(state.settings.model)}</small></header><div class="messages">${state.messages.length?state.messages.map(m=>`<div class="bubble ${m.role} ${m.error?'error':''}">${esc(m.text)}${m.txIds?.length?`<button class="undo" data-undo="${m.txIds.join(',')}">↶ 登録を取り消す</button>`:''}</div>`).join(''):'<div class="bubble ai">「今日コスモスで3,280円使った」のように話してください。レシート画像も原画質のまま送れます。</div>'}${state.pending.length?`<div class="pending"><h3>登録前の確認</h3>${state.pending.map((x,i)=>`<div class="pending-row"><span>${esc(x.merchant)}・${esc(x.category)}</span><b>${x.type==='income'?'+':'-'}${yen(x.amount)}</b></div>`).join('')}<div class="pending-actions"><button id="discardPending">破棄</button><button class="primary" id="confirmPending">登録する</button></div></div>`:''}<div id="end"></div></div><div class="composer">${state.image?`<div class="attach">▧ <b>${esc(state.image.name)}</b><small>${(state.image.size/1048576).toFixed(1)}MB・原画質</small><button id="clearImage">×</button></div>`:''}<div class="compose"><button id="photo">📷</button><input class="hidden" id="file" type="file" accept="image/*" capture="environment"><textarea id="chatText" rows="1" placeholder="支出や収入を話してください"></textarea><button class="send" id="send">➤</button></div></div></main>`}
function settings(){return `<main><header><div><small style="color:#4f46e5;font-weight:800">CONFIGURATION</small><h1>設定</h1></div></header><section class="card"><h2>🔑 Gemini API</h2><label>APIキー<input id="apiKey" type="password" value="${esc(state.settings.apiKey)}" placeholder="AIza..."></label><label>モデル名<input id="model" value="${esc(state.settings.model)}"></label><label>Temperature: <b id="tempv">${state.settings.temperature}</b><input id="temp" type="range" min="0" max="1" step="0.1" value="${state.settings.temperature}"></label><label>高額確認の基準<input id="highAmount" inputmode="numeric" value="${state.settings.highAmount||10000}"></label><label><input id="autoRegister" type="checkbox" style="width:auto" ${state.settings.autoRegister!==false?'checked':''}> 確信度が高い明細は自動登録</label><p class="notice">APIキーはこの端末のブラウザ内だけに保存します。GitHubには入りません。</p><button class="wide primary" id="saveSettings">✓ 設定を保存</button></section><section class="card"><h2>AIが覚えていること</h2><p>${state.memories.length}件の修正・店舗・入力傾向</p>${state.memories.length?state.memories.map((m,i)=>`<div class="memory"><button data-delmem="${i}">削除</button><b>${esc(m.kind||'記憶')}</b><br>${esc(m.text)}</div>`).join(''):'<div class="memory">まだ記憶はありません。AIの分類を修正すると記録されます。</div>'}<button class="wide" id="addMemory">＋ 手動で記憶を追加</button></section><section class="card"><h2>データ管理</h2><p>${state.txs.length}件の明細を保存中</p><button class="wide" id="export">↓ JSON完全バックアップ</button><button class="wide" id="csv">↓ CSV明細出力</button><button class="wide" id="import">↑ バックアップ読込</button><input class="hidden" id="importFile" type="file" accept="application/json"><button class="wide" id="clearAll" style="color:#be123c">全データを削除</button></section></main>`}
function bind(){if(state.tab==='ledger'){ $('#prev').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);render()};$('#next').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);render()};$('#add').onclick=()=>editor();$('#query').onchange=e=>{state.query=e.target.value;render()};$('#filter').onchange=e=>{state.filter=e.target.value;render()};document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>editor(state.txs.find(t=>t.id===x.dataset.edit)))}else if(state.tab==='chat'){setTimeout(()=>$('#end')?.scrollIntoView(),20);$('#photo').onclick=()=>$('#file').click();$('#file').onchange=e=>{let f=e.target.files[0];if(f){state.image={file:f,name:f.name,size:f.size,type:f.type};render()}};if($('#clearImage'))$('#clearImage').onclick=()=>{state.image=null;render()};$('#send').onclick=send;if($('#confirmPending'))$('#confirmPending').onclick=()=>{let ids=[];state.pending.forEach(x=>{x.id=x.id||uid('tx');ids.push(x.id);state.txs.push(x)});state.messages.push({id:uid('m'),role:'ai',text:state.pending.length+'件を確認して登録しました',txIds:ids,createdAt:Date.now()});state.pending=[];toast('登録しました');render()};if($('#discardPending'))$('#discardPending').onclick=()=>{state.pending=[];toast('候補を破棄しました');render()};document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{let ids=b.dataset.undo.split(',');state.txs=state.txs.filter(x=>!ids.includes(x.id));toast('登録を取り消しました');render()})}else{$('#temp').oninput=e=>$('#tempv').textContent=e.target.value;$('#saveSettings').onclick=()=>{state.settings={apiKey:$('#apiKey').value.trim(),model:$('#model').value.trim(),temperature:Number($('#temp').value),highAmount:Number($('#highAmount').value)||10000,autoRegister:$('#autoRegister').checked};toast('設定を保存しました');render()};$('#addMemory').onclick=()=>{let t=prompt('AIに覚えさせる内容');if(t){state.memories.push({kind:'手動ルール',text:t,createdAt:Date.now()});render()}};document.querySelectorAll('[data-delmem]').forEach(b=>b.onclick=()=>{state.memories.splice(Number(b.dataset.delmem),1);render()});$('#export').onclick=exportData;$('#csv').onclick=exportCsv;$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=importData;$('#clearAll').onclick=()=>{if(confirm('取引・会話・記憶をすべて削除しますか？')){state.txs=[];state.messages=[];state.memories=[];toast('データを削除しました');render()}}}}
function editor(v){let x=v||{id:uid('tx'),date:today(),type:'expense',amount:0,merchant:'',category:'食費',paymentMethod:'現金',note:'',source:'manual',createdAt:Date.now()},wrap=document.createElement('div');wrap.className='modal';wrap.innerHTML=`<div class="sheet"><div class="sheethead"><h2>${v?'明細を編集':'明細を追加'}</h2><button id="close">✕</button></div><div class="seg"><button data-type="expense" class="${x.type==='expense'?'on':''}">支出</button><button data-type="income" class="${x.type==='income'?'on':''}">収入</button></div><label>金額<input id="amount" inputmode="numeric" value="${x.amount||''}"></label><label>日付<input id="date" type="date" value="${x.date}"></label><label>店舗・相手<input id="merchant" value="${esc(x.merchant)}"></label><label>カテゴリ<input id="category" value="${esc(x.category)}"></label><label>支払方法<input id="payment" value="${esc(x.paymentMethod)}"></label><label>メモ<textarea id="note">${esc(x.note)}</textarea></label><button class="wide primary" id="saveTx">✓ 保存</button>${v?'<button class="wide" id="deleteTx" style="color:#be123c">削除</button>':''}</div>`;document.body.append(wrap);wrap.onclick=e=>{if(e.target===wrap)wrap.remove()};$('#close').onclick=()=>wrap.remove();wrap.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{x.type=b.dataset.type;wrap.querySelectorAll('[data-type]').forEach(z=>z.classList.toggle('on',z.dataset.type===x.type))});$('#saveTx').onclick=()=>{x={...x,amount:Number($('#amount').value.replace(/\D/g,'')),date:$('#date').value,merchant:$('#merchant').value||'未設定',category:$('#category').value||'その他',paymentMethod:$('#payment').value||'未設定',note:$('#note').value};if(!x.amount)return toast('金額を入力してください');let i=state.txs.findIndex(t=>t.id===x.id);if(i>=0){let old=state.txs[i];if(old.category!==x.category||old.merchant!==x.merchant||old.paymentMethod!==x.paymentMethod)state.memories.push({kind:'修正から学習',text:`${old.merchant}の分類を「${old.category}」から「${x.category}」へ修正。支払方法:${x.paymentMethod}`,createdAt:Date.now()});state.txs[i]=x}else state.txs.push(x);wrap.remove();toast('明細を保存しました');render()};if(v)$('#deleteTx').onclick=()=>{state.txs=state.txs.filter(t=>t.id!==x.id);wrap.remove();toast('削除しました');render()}}
async function fileBase64(f){let bytes=new Uint8Array(await f.arrayBuffer()),s='',n=32768;for(let i=0;i<bytes.length;i+=n)s+=String.fromCharCode(...bytes.subarray(i,i+n));return btoa(s)}
async function send(){let text=$('#chatText').value.trim(),img=state.image;if(!text&&!img)return;if(!state.settings.apiKey)return toast('設定でAPIキーを保存してください');state.messages.push({id:uid('m'),role:'user',text:text||(img?'レシート: '+img.name:''),createdAt:Date.now()});render();try{let prompt=`あなたは個人用家計簿の入力担当です。会話またはレシートから取引を抽出してください。JSONのみ返してください。形式:{"reply":"短い返答","transactions":[{"date":"YYYY-MM-DD","type":"incomeまたはexpense","amount":整数,"merchant":"店舗や相手","category":"カテゴリ","paymentMethod":"支払方法","note":"摘要","confidence":0.0}]}。今日:${today()}。ユーザー記憶:${state.memories.map(m=>m.text).join(' / ')||'なし'}。レシートは合計額だけでなく商品明細を読み、家計簿には原則として会計合計を1件として登録する。複数の別会計が明確な場合のみ複数件にする。不明な場合はtransactionsを空にしてreplyで質問。ユーザー:${text||'添付レシートを解析'}`;let parts=[{text:prompt}];if(img)parts.push({inlineData:{mimeType:img.type||'image/jpeg',data:await fileBase64(img.file)}});let url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(state.settings.model)}:generateContent?key=${encodeURIComponent(state.settings.apiKey)}`;let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{temperature:state.settings.temperature,responseMimeType:'application/json'}})});let d=await r.json();if(!r.ok)throw Error(d?.error?.message||'APIエラー '+r.status);let raw=d?.candidates?.[0]?.content?.parts?.[0]?.text;if(!raw)throw Error('AIの応答が空です');let result=JSON.parse(raw),ids=[];(result.transactions||[]).forEach(x=>{if(Number(x.amount)>0){let id=uid('tx');ids.push(id);state.txs.push({id,date:x.date||today(),type:x.type==='income'?'income':'expense',amount:Number(x.amount),merchant:x.merchant||'未設定',category:x.category||'その他',paymentMethod:x.paymentMethod||'未設定',note:x.note||text,source:img?'receipt':'chat',confidence:Number(x.confidence??1),createdAt:Date.now()})}});let candidates=state.txs.filter(x=>ids.includes(x.id)),needsConfirm=!state.settings.autoRegister||candidates.some(x=>x.amount>=(state.settings.highAmount||10000))||candidates.some(x=>Number(x.confidence||1)<.8);if(needsConfirm&&candidates.length){state.txs=state.txs.filter(x=>!ids.includes(x.id));state.pending=candidates;ids=[];state.messages.push({id:uid('m'),role:'ai',text:(result.reply||'内容を確認してください')+' 高額または確信度の条件により、登録前確認にしました。',createdAt:Date.now()})}else state.messages.push({id:uid('m'),role:'ai',text:result.reply||ids.length+'件を登録しました',txIds:ids,createdAt:Date.now()});state.image=null;toast(needsConfirm&&candidates.length?'登録内容を確認してください':ids.length?ids.length+'件を登録しました':'AIから返答がありました')}catch(e){state.messages.push({id:uid('m'),role:'ai',text:'エラー: '+e.message,error:true,createdAt:Date.now()})}render()}
function exportData(){let data={version:1,exportedAt:new Date().toISOString(),txs:state.txs,messages:state.messages,memories:state.memories,settings:{...state.settings,apiKey:''}};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='aikakeibo-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
